[project]
name = "lyra-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic-settings",
  "redis",
  "arq",
  "pywebpush",
  "httpx",
  "openai",
  "anthropic",
  "python-multipart",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
